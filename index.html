<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2·6학년 새로가족 전래 놀이 한마당</title>

<style>
:root{
  --brown:#4a2b20;
  --light-brown:#826754;
  --yellow:#f1dc00;
  --red:#df4b46;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color:var(--brown);
  background:
    radial-gradient(circle at 0 0,#f8dd82 0 140px,transparent 141px),
    radial-gradient(circle at 100% 100%,#f3e5bd 0 120px,transparent 121px),
    #fffefb;
}

button{
  font:inherit;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

button:focus-visible{
  outline:3px solid #3f7bd0;
  outline-offset:2px;
}

img{
  -webkit-user-drag:none;
  user-select:none;
}

/* ----------------------
   놀이 이미지 타일
---------------------- */

.tile{
  display:grid;
  place-items:center;
  padding:10px;
  border:2px solid #ece1d1;
  border-radius:22px;
  background:#fff;
}

.tile img{
  max-width:100%;
  max-height:100%;
  border-radius:12px;
  object-fit:contain;
}

/* ----------------------
   교실 선택
---------------------- */

#setup{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  overflow:auto;
  background:#fffdf8;
}

.setup-box{
  width:min(880px,100%);
  text-align:center;
}

.setup-title{
  margin-bottom:18px;
  padding:20px;
  border-radius:20px;
  background:#e8ded0;
  font-size:clamp(24px,3.6vw,38px);
  font-weight:900;
}

.setup-clock{
  font-size:clamp(32px,5.5vw,54px);
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:-2px;
}

.setup-clock-note{
  margin:6px 0 24px;
  color:#8a7261;
  font-size:15px;
  font-weight:700;
  line-height:1.5;
}

.setup-sub{
  margin-bottom:18px;
  font-size:20px;
  font-weight:800;
}

.room-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.room-btn{
  display:flex;
  align-items:center;
  gap:16px;
  padding:16px 18px;
  border:2px solid #e4d7c6;
  border-radius:22px;
  background:#fff;
  color:inherit;
  text-align:left;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(70,45,30,.08);
}

.room-btn:hover{
  transform:translateY(-3px);
  background:#fffbef;
}

.room-btn .tile{
  flex:none;
  width:92px;
  height:82px;
  border-radius:16px;
}

.room-btn strong{
  display:block;
  font-size:24px;
}

.room-btn span{
  color:#836a59;
  font-size:17px;
  font-weight:700;
}

.setup-tools{margin-top:22px;}

.setup-tools button{
  padding:11px 18px;
  border:1px solid #ded3c6;
  border-radius:999px;
  background:#fff;
  color:#6d5949;
  cursor:pointer;
  font-size:14px;
  font-weight:800;
}

/* ----------------------
   메인
---------------------- */

.page{
  width:min(1180px,calc(100% - 30px));
  margin:auto;
  padding:20px 0 70px;
}

.header{
  padding:16px 25px;
  border-radius:20px;
  background:#e7ded1;
  text-align:center;
  box-shadow:0 8px 25px rgba(70,45,30,.08);
}

.header-title{
  font-size:clamp(24px,3.8vw,42px);
  font-weight:900;
  letter-spacing:-2px;
}

.top-info{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:7px 13px;
  border:1px solid #ded3c5;
  border-radius:999px;
  background:#fff;
  font-size:14px;
  font-weight:800;
}

#partBadge{background:#fff1b8;}

#manualBadge,
#previewBadge{display:none;}

#manualBadge{
  background:#ffd9d9;
  color:#a50000;
}

#previewBadge{
  background:#dcecff;
  color:#245d91;
}

#manualBadge.show,
#previewBadge.show{display:inline-flex;}

.main-card{
  margin-top:18px;
  overflow:hidden;
  border:2px solid #eee3d4;
  border-radius:28px;
  background:#fff;
  box-shadow:0 12px 35px rgba(70,45,30,.10);
}

.status{
  padding:13px;
  background:#f3ede4;
  text-align:center;
  font-size:19px;
  font-weight:900;
}

.status.warning{background:#fff0a6;}

.status.danger{
  background:#ffd4d4;
  color:#a80000;
}

.status.paused{
  background:#e2e6ea;
  color:#3f4a54;
}

.content{
  padding:28px 25px 28px;
  text-align:center;
}

.identity{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
}

.identity .tile{
  flex:none;
  width:178px;
  height:158px;
}

.identity-text{text-align:left;}

.identity.no-image .tile{display:none;}

.identity.no-image .identity-text{text-align:center;}

.room-label{
  color:var(--light-brown);
  font-size:19px;
  font-weight:800;
}

.play-name{
  margin-top:3px;
  font-size:clamp(36px,5.6vw,62px);
  font-weight:900;
  letter-spacing:-2px;
  line-height:1.1;
}

.timer-label{
  margin-top:24px;
  color:var(--light-brown);
  font-size:19px;
  font-weight:800;
}

.timer{
  margin-top:3px;
  font-size:clamp(76px,13.5vw,142px);
  line-height:1;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  letter-spacing:-5px;
}

.timer.wait{
  font-size:clamp(48px,8vw,88px);
  letter-spacing:-3px;
}

.timer.warning{color:#d69800;}

.timer.danger{
  color:var(--red);
  animation:pulse .55s infinite alternate;
}

.timer.paused{
  color:#8d99a4;
  animation:none;
}

@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.025);}
}

@media(prefers-reduced-motion:reduce){
  .timer.danger{animation:none;}
  .room-btn:hover{transform:none;}
}

.guide{
  max-width:860px;
  margin:26px auto 0;
  padding:18px 22px;
  border:1px solid #e8ddcd;
  border-radius:18px;
  background:#faf6ee;
  font-size:clamp(18px,2.2vw,24px);
  font-weight:750;
  line-height:1.6;
}

.guide strong{color:#c84732;}

.route{padding:0 25px 30px;}

.route-title{
  margin-bottom:12px;
  text-align:center;
  color:var(--light-brown);
  font-weight:800;
}

.steps{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.step{
  padding:13px 5px;
  border:2px solid #e7ded2;
  border-radius:16px;
  background:#faf8f4;
  text-align:center;
  font-weight:800;
}

.step.active{
  transform:translateY(-3px);
  border-color:#e9ce00;
  background:#fff5ad;
}

.step.done{opacity:.48;}

/* ----------------------
   운영 버튼
---------------------- */

.controls{
  position:fixed;
  right:17px;
  bottom:17px;
  z-index:100;
}

.control-btn{
  padding:11px 15px;
  border:none;
  border-radius:999px;
  background:#4a3327;
  color:#fff;
  cursor:pointer;
  font-size:14px;
  font-weight:800;
  box-shadow:0 6px 20px rgba(0,0,0,.18);
  opacity:.55;
}

.control-btn:hover,
.control-btn.open{opacity:1;}

/* ----------------------
   운영자 패널
---------------------- */

#adminPanel{
  position:fixed;
  right:18px;
  bottom:72px;
  z-index:500;
  display:none;
  width:min(390px,calc(100vw - 36px));
  max-height:calc(100vh - 100px);
  overflow:auto;
  padding:20px;
  border:1px solid #d8cbbd;
  border-radius:22px;
  background:#fff;
  box-shadow:0 15px 45px rgba(0,0,0,.22);
}

#adminPanel.show{display:block;}

.admin-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.admin-title{
  margin:0;
  font-size:21px;
  font-weight:900;
}

.panel-close{
  flex:none;
  width:34px;
  height:34px;
  border:1px solid #e0d5c8;
  border-radius:50%;
  background:#faf7f2;
  color:#6d5949;
  cursor:pointer;
  font-size:16px;
  font-weight:900;
  line-height:1;
}

.admin-description{
  margin:7px 0 14px;
  color:#806a59;
  font-size:13px;
  line-height:1.5;
}

.manual-warning{
  display:none;
  margin-bottom:12px;
  padding:10px;
  border-radius:11px;
  background:#ffe0e0;
  color:#a30000;
  text-align:center;
  font-weight:900;
}

.manual-warning.show{display:block;}

.admin-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.admin-grid button{
  min-height:48px;
  padding:10px 8px;
  border:1px solid #ded3c6;
  border-radius:12px;
  background:#faf7f2;
  color:inherit;
  cursor:pointer;
  font-weight:850;
}

.admin-grid button:hover{background:#f3eadf;}

.admin-grid .primary{background:#fff3bd;}

.admin-grid .auto{
  grid-column:1 / -1;
  background:#e3f2e6;
  color:#285f35;
}

.admin-state{
  margin-top:13px;
  padding:10px;
  border-radius:10px;
  background:#f6f3ee;
  font-size:12px;
  line-height:1.6;
}

@media(max-width:820px){
  .identity{flex-direction:column;gap:14px;}
  .identity-text{text-align:center;}
  .identity .tile{width:150px;height:132px;}
}

@media(max-width:650px){
  .room-buttons{grid-template-columns:1fr;}
  .steps{grid-template-columns:1fr 1fr;}
  .timer{letter-spacing:-3px;}
}
</style>
</head>

<body>

<div id="setup">
  <div class="setup-box">

    <div class="setup-title">
      2·6학년 새로가족 전래 놀이 한마당
    </div>

    <div class="setup-clock" id="setupClock">--:--:--</div>

    <div class="setup-clock-note">
      이 시각이 휴대폰 시계와 같은지 확인해주세요.<br>
      네 교실 시계가 맞아야 진행이 어긋나지 않습니다.
    </div>

    <div class="setup-sub">
      이 전자칠판이 있는 교실을 선택해주세요 😊
    </div>

    <div class="room-buttons" id="roomButtons"></div>

    <div class="setup-tools">
      <button id="setupFullscreenBtn">⛶ 전체화면으로 보기</button>
    </div>

  </div>
</div>

<div class="page">

  <header class="header">

    <div class="header-title">
      2·6학년 새로가족 전래 놀이 한마당
    </div>

    <div class="top-info">
      <div class="badge" id="roomBadge">교실</div>
      <div class="badge" id="partBadge">준비</div>
      <div class="badge" id="clockBadge">--:--:--</div>
      <div class="badge" id="manualBadge">⚠️ 수동 운영 중</div>
      <div class="badge" id="previewBadge">🧪 미리보기</div>
    </div>

  </header>

  <main class="main-card">

    <div class="status" id="status">행사 준비 중</div>

    <section class="content">

      <div class="identity" id="identity">

        <div class="tile">
          <img id="playImage" src="" alt="">
        </div>

        <div class="identity-text">
          <div class="room-label" id="roomLabel"></div>
          <div class="play-name" id="playName"></div>
        </div>

      </div>

      <div class="timer-label" id="timerLabel"></div>

      <div class="timer" id="timer">--:--</div>

      <div class="guide" id="guide"></div>

    </section>

    <section class="route">

      <div class="route-title">현재 부 진행 상황</div>

      <div class="steps" id="steps"></div>

    </section>

  </main>
</div>

<div class="controls">
  <button class="control-btn" id="adminOpenBtn">⚙️ 운영</button>
</div>

<div id="adminPanel">

  <div class="admin-head">
    <h3 class="admin-title">교사용 비상 운영</h3>
    <button class="panel-close" id="panelCloseBtn" aria-label="패널 닫기">✕</button>
  </div>

  <div class="admin-description">
    이 조작은 <strong>현재 교실 전자칠판에만</strong> 적용됩니다.
    다른 교실 시간은 바뀌지 않습니다.
  </div>

  <div class="manual-warning" id="manualWarning">
    ⚠️ 수동 운영 중 — 실제 행사 시간과 다를 수 있습니다.
  </div>

  <div class="admin-grid">

    <button id="pauseBtn" class="primary">⏸ 일시정지</button>
    <button id="changeRoomBtn">🏫 교실 변경</button>

    <button id="prevBtn">◀ 이전 단계</button>
    <button id="nextBtn">다음 단계 ▶</button>

    <button id="plus30Btn">+30초 연장</button>
    <button id="plus60Btn">+1분 연장</button>

    <button id="soundBtn">🔔 알림음 켜기</button>
    <button id="fullscreenBtn">⛶ 전체화면</button>

    <button id="autoBtn" class="auto">🔄 실제 시간 자동 운영으로 복귀</button>

  </div>

  <div class="admin-state" id="adminState"></div>

</div>


<script>
(() => {

"use strict";

/* =====================================================
   1. 놀이 이미지
===================================================== */

const IMAGES = {
  top:"images/top.svg",
  yut:"images/yut.svg",
  gonggi:"images/gonggi.svg",
  omok:"images/omok.svg"
};


/* =====================================================
   2. 고정 놀이 정보
===================================================== */

const ROOMS = {
  1:{classroom:"6학년 1반", name:"팽이 돌리기",  img:IMAGES.top,    nextRoom:2},
  2:{classroom:"6학년 2반", name:"윷놀이",      img:IMAGES.yut,    nextRoom:3},
  3:{classroom:"6학년 3반", name:"공기놀이",     img:IMAGES.gonggi, nextRoom:4},
  4:{classroom:"6학년 4반", name:"오목 · 알까기", img:IMAGES.omok,   nextRoom:1}
};


/* =====================================================
   3. 행사 시간표
===================================================== */

const PHASE_TEMPLATES = [

  /* 1부 */
  {type:"play", part:1, round:1, start:"10:50", end:"10:58"},
  {type:"move", part:1, round:1, start:"10:58", end:"11:00"},

  {type:"play", part:1, round:2, start:"11:00", end:"11:08"},
  {type:"move", part:1, round:2, start:"11:08", end:"11:10"},

  {type:"play", part:1, round:3, start:"11:10", end:"11:18"},
  {type:"move", part:1, round:3, start:"11:18", end:"11:20"},

  {type:"play", part:1, round:4, start:"11:20", end:"11:28"},

  {type:"tidy", part:1, start:"11:28", end:"11:30"},

  {type:"swap", start:"11:30", end:"11:35"},

  /* 2부 */
  {type:"play", part:2, round:1, start:"11:35", end:"11:43"},
  {type:"move", part:2, round:1, start:"11:43", end:"11:45"},

  {type:"play", part:2, round:2, start:"11:45", end:"11:53"},
  {type:"move", part:2, round:2, start:"11:53", end:"11:55"},

  {type:"play", part:2, round:3, start:"11:55", end:"12:03"},
  {type:"move", part:2, round:3, start:"12:03", end:"12:05"},

  {type:"play", part:2, round:4, start:"12:05", end:"12:13"}

];

const TIMEZONE = "Asia/Seoul";


/* =====================================================
   4. 한국어 조사
===================================================== */

function lastJong(word){

  if(!word){
    return -1;
  }

  const code =
    word.charCodeAt(word.length - 1) - 0xAC00;

  if(code < 0 || code > 11171){
    return -1;
  }

  return code % 28;
}


function josaRo(word){

  const jong = lastJong(word);

  if(jong === -1){
    return word + "로";
  }

  return word + (
    jong === 0 || jong === 8 ? "로" : "으로"
  );
}


/* =====================================================
   5. DOM
===================================================== */

const $ = id => document.getElementById(id);

const setup         = $("setup");
const setupClock    = $("setupClock");
const roomButtons   = $("roomButtons");
const roomBadge     = $("roomBadge");
const partBadge     = $("partBadge");
const clockBadge    = $("clockBadge");
const manualBadge   = $("manualBadge");
const previewBadge  = $("previewBadge");
const statusBar     = $("status");
const identity      = $("identity");
const playImage     = $("playImage");
const roomLabel     = $("roomLabel");
const playName      = $("playName");
const timerLabel    = $("timerLabel");
const timerEl       = $("timer");
const guide         = $("guide");
const stepsEl       = $("steps");
const adminPanel    = $("adminPanel");
const adminOpenBtn  = $("adminOpenBtn");
const manualWarning = $("manualWarning");
const adminState    = $("adminState");
const pauseBtn      = $("pauseBtn");
const soundBtn      = $("soundBtn");
const fullscreenBtn = $("fullscreenBtn");


/* 값이 바뀔 때만 DOM을 건드린다 */

function setText(el,value){

  if(el.__v !== value){
    el.__v = value;
    el.textContent = value;
  }

}


function setHTML(el,value){

  if(el.__v !== value){
    el.__v = value;
    el.innerHTML = value;
  }

}


function setClass(el,value){

  if(el.className !== value){
    el.className = value;
  }

}


function setImage(src,alt){

  if(playImage.__src !== src){
    playImage.__src = src;
    playImage.src = src;
    playImage.alt = alt;
  }

}


/* =====================================================
   6. URL 파라미터
===================================================== */

const params =
  new URLSearchParams(window.location.search);

const urlRoom     = Number(params.get("room"));
const urlDate     = params.get("date");
const previewTime = params.get("preview");
const previewSpeed= Number(params.get("speed"));


/* =====================================================
   7. 한국 날짜
===================================================== */

function getKoreaDateString(){

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone:TIMEZONE,
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
      }
    ).formatToParts(new Date());

  const obj = {};

  parts.forEach(part => {

    if(part.type !== "literal"){
      obj[part.type] = part.value;
    }

  });

  return obj.year + "-" + obj.month + "-" + obj.day;
}


function validDateString(value){

  return (
    typeof value === "string" &&
    /^\d{4}-\d{2}-\d{2}$/.test(value)
  );

}


const EVENT_DATE =
  validDateString(urlDate)
    ? urlDate
    : getKoreaDateString();


function eventTime(time){

  return new Date(
    EVENT_DATE + "T" + time + ":00+09:00"
  ).getTime();

}


const PHASES =
  PHASE_TEMPLATES.map((phase,index) => ({
    ...phase,
    index,
    startMs:eventTime(phase.start),
    endMs:eventTime(phase.end)
  }));

const FIRST_START = PHASES[0].startMs;

const LAST_END = PHASES[PHASES.length - 1].endMs;


/* =====================================================
   8. 리허설 미리보기
   ?preview=10:48&speed=20
===================================================== */

function previewTimeToMs(value){

  if(
    !value ||
    !/^\d{2}:\d{2}(:\d{2})?$/.test(value)
  ){
    return null;
  }

  const normalized =
    value.length === 5 ? value + ":00" : value;

  const ms =
    new Date(
      EVENT_DATE + "T" + normalized + "+09:00"
    ).getTime();

  return Number.isFinite(ms) ? ms : null;
}


const PREVIEW_MS = previewTimeToMs(previewTime);

const PREVIEW_ACTIVE = Number.isFinite(PREVIEW_MS);

const PREVIEW_LOADED = Date.now();

const SPEED =
  PREVIEW_ACTIVE &&
  Number.isFinite(previewSpeed) &&
  previewSpeed > 0 &&
  previewSpeed <= 120
    ? previewSpeed
    : 1;

if(PREVIEW_ACTIVE){

  previewBadge.textContent =
    SPEED === 1
      ? "🧪 미리보기"
      : "🧪 미리보기 ×" + SPEED;

  previewBadge.classList.add("show");

}


function baseNow(){

  if(PREVIEW_ACTIVE){
    return PREVIEW_MS +
      (Date.now() - PREVIEW_LOADED) * SPEED;
  }

  return Date.now();
}


/* =====================================================
   9. 교실 선택
===================================================== */

let currentRoom = null;


Object.keys(ROOMS).forEach(key => {

  const room = ROOMS[key];

  const button =
    document.createElement("button");

  button.className = "room-btn";
  button.dataset.room = key;

  button.innerHTML =
    '<div class="tile"><img src="' + room.img +
    '" alt="' + room.name + '"></div>' +
    '<div><strong>' + room.classroom +
    '</strong><span>' + room.name + '</span></div>';

  button.addEventListener(
    "click",
    () => chooseRoom(Number(key))
  );

  roomButtons.appendChild(button);

});


function readSavedRoom(){

  try{

    const saved =
      Number(
        localStorage.getItem("traditionalPlayRoom")
      );

    return ROOMS[saved] ? saved : null;

  }catch{

    return null;

  }

}


function saveRoom(room){

  try{

    localStorage.setItem(
      "traditionalPlayRoom",
      String(room)
    );

  }catch{}

}


function chooseRoom(room){

  if(!ROOMS[room]){
    return;
  }

  currentRoom = room;

  saveRoom(room);

  setup.style.display = "none";


  /* file:// 에서는 예외가 날 수 있다 */

  try{

    const newParams =
      new URLSearchParams(window.location.search);

    newParams.set("room",room);

    history.replaceState(
      null,
      "",
      window.location.pathname + "?" + newParams.toString()
    );

  }catch{}


  loadManualState();

  unlockAudio();

  requestWakeLock();

  render();
}


if(ROOMS[urlRoom]){

  currentRoom = urlRoom;

  saveRoom(currentRoom);

  setup.style.display = "none";

}else{

  const savedRoom = readSavedRoom();

  if(savedRoom){

    currentRoom = savedRoom;

    setup.style.display = "none";

  }

}


/* =====================================================
   10. 수동 운영 상태
===================================================== */

const EMPTY_MANUAL = {
  active:false,
  paused:false,
  offsetMs:0,
  frozenMs:null
};

let manual = {...EMPTY_MANUAL};


function manualStorageKey(){

  return (
    "traditionalPlayManual:" +
    EVENT_DATE + ":" + currentRoom
  );

}


function loadManualState(){

  manual = {...EMPTY_MANUAL};

  if(!currentRoom || PREVIEW_ACTIVE){
    return;
  }

  try{

    const saved =
      JSON.parse(
        localStorage.getItem(manualStorageKey())
      );

    if(!saved){
      return;
    }

    if(typeof saved.active === "boolean"){
      manual.active = saved.active;
    }

    if(typeof saved.paused === "boolean"){
      manual.paused = saved.paused;
    }

    if(Number.isFinite(saved.offsetMs)){
      manual.offsetMs = saved.offsetMs;
    }

    if(Number.isFinite(saved.frozenMs)){
      manual.frozenMs = saved.frozenMs;
    }

  }catch{}

}


function saveManualState(){

  if(!currentRoom || PREVIEW_ACTIVE){
    return;
  }

  try{

    localStorage.setItem(
      manualStorageKey(),
      JSON.stringify(manual)
    );

  }catch{}

}


function clearManualState(){

  manual = {...EMPTY_MANUAL};

  try{

    localStorage.removeItem(manualStorageKey());

  }catch{}

}


/* =====================================================
   11. 현재 적용 시각
===================================================== */

function getNow(){

  if(
    manual.active &&
    manual.paused &&
    Number.isFinite(manual.frozenMs)
  ){
    return manual.frozenMs;
  }

  if(manual.active){
    return baseNow() + manual.offsetMs;
  }

  return baseNow();
}


/* =====================================================
   12. 현재 단계
===================================================== */

function getPhase(now){

  if(now < FIRST_START){

    return {
      type:"waiting",
      index:-1,
      startMs:null,
      endMs:FIRST_START
    };

  }

  for(const phase of PHASES){

    if(now >= phase.startMs && now < phase.endMs){
      return phase;
    }

  }

  return {
    type:"finished",
    index:PHASES.length,
    startMs:LAST_END,
    endMs:null
  };

}


/* =====================================================
   13. 시간 표시
===================================================== */

function getRemainingSeconds(endMs,now){

  if(!Number.isFinite(endMs)){
    return 0;
  }

  return Math.max(
    0,
    Math.ceil((endMs - now) / 1000)
  );

}


function formatTimer(seconds){

  return (
    String(Math.floor(seconds / 60)).padStart(2,"0") +
    ":" +
    String(seconds % 60).padStart(2,"0")
  );

}


function formatWait(seconds){

  if(seconds < 3600){
    return formatTimer(seconds);
  }

  const hour = Math.floor(seconds / 3600);
  const min = Math.floor((seconds % 3600) / 60);

  return hour + "시간 " + min + "분";
}


function formatClock(ms){

  return new Intl.DateTimeFormat(
    "ko-KR",
    {
      timeZone:TIMEZONE,
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit",
      hourCycle:"h23"
    }
  ).format(new Date(ms));
}


/* =====================================================
   14. 알림음
===================================================== */

let audioCtx = null;

let soundOn = false;


try{

  soundOn =
    localStorage.getItem("traditionalPlaySound") === "on";

}catch{}


function unlockAudio(){

  try{

    if(!audioCtx){

      const Ctx =
        window.AudioContext || window.webkitAudioContext;

      if(!Ctx){
        return;
      }

      audioCtx = new Ctx();

    }

    if(audioCtx.state === "suspended"){
      audioCtx.resume();
    }

  }catch{}

}


function beep(freq,duration,volume,delay){

  if(!soundOn || !audioCtx){
    return;
  }

  try{

    const start =
      audioCtx.currentTime + (delay || 0);

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.value = freq;

    gain.gain.setValueAtTime(0.0001,start);

    gain.gain.exponentialRampToValueAtTime(
      volume,
      start + 0.015
    );

    gain.gain.exponentialRampToValueAtTime(
      0.0001,
      start + duration
    );

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(start);
    osc.stop(start + duration + 0.03);

  }catch{}

}


const firedCues = new Set();

let lastPhaseIndex = null;


function handleCues(phase,remaining){

  if(!soundOn){
    lastPhaseIndex = phase.index;
    return;
  }

  if(manual.active && manual.paused){
    return;
  }

  if(
    lastPhaseIndex !== null &&
    lastPhaseIndex !== phase.index
  ){
    beep(660,0.16,0.25);
    beep(880,0.22,0.25,0.20);
  }

  lastPhaseIndex = phase.index;

  if(
    phase.type !== "play" &&
    phase.type !== "move" &&
    phase.type !== "tidy"
  ){
    return;
  }

  const cue60 = phase.index + ":60";
  const cue10 = phase.index + ":10";

  if(remaining === 60 && !firedCues.has(cue60)){
    firedCues.add(cue60);
    beep(760,0.18,0.2);
  }

  if(remaining === 10 && !firedCues.has(cue10)){
    firedCues.add(cue10);
    beep(980,0.14,0.25);
    beep(980,0.14,0.25,0.18);
  }

}


function updateSoundButton(){

  soundBtn.textContent =
    soundOn ? "🔕 알림음 끄기" : "🔔 알림음 켜기";

}


function setSound(on){

  soundOn = on;

  try{

    localStorage.setItem(
      "traditionalPlaySound",
      on ? "on" : "off"
    );

  }catch{}

  if(on){
    unlockAudio();
    beep(880,0.15,0.2);
  }

  updateSoundButton();
}


updateSoundButton();


/* =====================================================
   15. 화면 꺼짐 방지
===================================================== */

let wakeLock = null;


async function requestWakeLock(){

  try{

    if(!("wakeLock" in navigator)){
      return;
    }

    if(wakeLock){
      return;
    }

    wakeLock =
      await navigator.wakeLock.request("screen");

    wakeLock.addEventListener(
      "release",
      () => { wakeLock = null; }
    );

  }catch{}

}


/* =====================================================
   16. 단계 이동 / 시간 조작
===================================================== */

function setEffectiveTime(targetMs){

  if(!Number.isFinite(targetMs)){
    return;
  }

  manual.active = true;

  if(manual.paused){
    manual.frozenMs = targetMs;
  }else{
    manual.offsetMs = targetMs - baseNow();
  }

  saveManualState();

  render();
}


function nextStage(){

  const phase = getPhase(getNow());

  if(phase.type === "waiting"){
    setEffectiveTime(FIRST_START + 100);
    return;
  }

  if(
    phase.index >= 0 &&
    phase.index < PHASES.length - 1
  ){
    setEffectiveTime(
      PHASES[phase.index + 1].startMs + 100
    );
    return;
  }

  if(phase.index === PHASES.length - 1){
    setEffectiveTime(LAST_END + 100);
  }

}


function previousStage(){

  const phase = getPhase(getNow());

  if(phase.type === "finished"){
    setEffectiveTime(
      PHASES[PHASES.length - 1].startMs + 100
    );
    return;
  }

  if(phase.index > 0){
    setEffectiveTime(
      PHASES[phase.index - 1].startMs + 100
    );
    return;
  }

  if(phase.index === 0){
    setEffectiveTime(FIRST_START - 1000);
  }

}


function togglePause(){

  /* 정지 → 재개 */

  if(manual.active && manual.paused){

    manual.offsetMs = manual.frozenMs - baseNow();
    manual.paused = false;
    manual.frozenMs = null;

    saveManualState();
    render();

    return;
  }

  /* 현재 시점에서 정지 */

  manual.active = true;
  manual.paused = true;
  manual.frozenMs = getNow();

  saveManualState();
  render();

}


/*
  연장은 가상 시각을 뒤로 미는 방식이라
  현재 단계 시작점보다 앞으로 가면
  직전 라운드로 되돌아가버린다.
  단계 시작 시각으로 막아둔다.
*/

function extendTime(ms){

  const now = getNow();
  const phase = getPhase(now);

  let target = now - ms;

  if(Number.isFinite(phase.startMs)){
    target = Math.max(target,phase.startMs + 100);
  }

  setEffectiveTime(target);
}


function returnToAuto(){

  clearManualState();

  render();

}


/* =====================================================
   17. 라운드 표시
===================================================== */

const stepNodes = [];

for(let round = 1; round <= 4; round++){

  const node = document.createElement("div");

  node.className = "step";
  node.textContent = round + "라운드";

  stepsEl.appendChild(node);
  stepNodes.push(node);

}


function renderSteps(phase){

  for(let round = 1; round <= 4; round++){

    const node = stepNodes[round - 1];

    let done = false;
    let active = false;

    if(phase.round){
      done = round < phase.round;
      active = round === phase.round;
    }

    if(
      phase.type === "tidy" ||
      phase.type === "swap" ||
      phase.type === "finished"
    ){
      done = true;
    }

    node.classList.toggle("done",done);
    node.classList.toggle("active",active);

  }

}


/* =====================================================
   18. 운영 패널 상태
===================================================== */

function renderAdmin(now){

  const paused = manual.active && manual.paused;

  if(manual.active){

    manualBadge.textContent =
      paused ? "⏸ 일시정지 중" : "⚠️ 수동 운영 중";

    manualBadge.classList.add("show");
    manualWarning.classList.add("show");

  }else{

    manualBadge.classList.remove("show");
    manualWarning.classList.remove("show");

  }

  setText(
    pauseBtn,
    paused ? "▶ 다시 시작" : "⏸ 일시정지"
  );

  setHTML(
    adminState,
    (
      PREVIEW_ACTIVE
        ? "리허설 기준 시각 : "
        : "실제 PC 시각 : "
    ) +
    formatClock(baseNow()) + "<br>" +
    "화면 적용 시각 : " + formatClock(now) + "<br>" +
    "운영 상태 : " +
    (
      manual.active
        ? (paused ? "수동 · 일시정지" : "수동 운영")
        : "자동 운영"
    )
  );

}


/* =====================================================
   19. 메인 화면
===================================================== */

function render(){

  setText(setupClock,formatClock(baseNow()));

  if(!currentRoom){
    return;
  }

  const room = ROOMS[currentRoom];
  const now = getNow();
  const phase = getPhase(now);
  const paused = manual.active && manual.paused;
  const remaining = getRemainingSeconds(phase.endMs,now);

  handleCues(phase,remaining);

  setText(roomBadge,"🏫 " + room.classroom);
  setText(clockBadge,"🕐 " + formatClock(baseNow()));

  let statusText = "";
  let statusClass = "";
  let timerClass = "";
  let showImage = true;


  /* -------------------
     행사 시작 전
  ------------------- */

  if(phase.type === "waiting"){

    setText(partBadge,"행사 시작 전");

    statusText = "🌿 놀이마당 준비";

    setImage(room.img,room.name);
    setText(roomLabel,room.classroom + " 놀이마당");
    setText(playName,room.name);

    setText(timerLabel,"1부 시작까지");
    setText(timerEl,formatWait(remaining));

    if(remaining >= 3600){
      timerClass = "wait";
    }

    setHTML(
      guide,
      "첫 번째 새로가족을 맞이할 준비를 해주세요 😊"
    );

  }


  /* -------------------
     놀이
  ------------------- */

  else if(phase.type === "play"){

    setText(partBadge,phase.part + "부");

    setImage(room.img,room.name);
    setText(roomLabel,room.classroom + " 놀이마당");
    setText(playName,room.name);

    setText(timerLabel,"남은 놀이 시간");
    setText(timerEl,formatTimer(remaining));

    const head =
      phase.part + "부 · " + phase.round + "라운드";

    if(remaining <= 10){

      statusText = "🔔 " + head + " · 마지막 10초!";
      statusClass = "danger";
      timerClass = "danger";

      setHTML(
        guide,
        "<strong>놀이를 마무리해주세요!</strong>"
      );

    }

    else if(remaining <= 60){

      statusText = "⏰ " + head + " · 1분 남음";
      statusClass = "warning";
      timerClass = "warning";

      setHTML(
        guide,
        "<strong>1분 남았습니다.</strong> 놀잇감을 천천히 정리해주세요."
      );

    }

    else{

      statusText = "🎉 " + head + " / 4";

      if(phase.round < 4){

        const next = ROOMS[room.nextRoom];

        setHTML(
          guide,
          "즐겁게 놀이해주세요 😊<br>다음 이동 → <strong>" +
          next.classroom + " " + next.name + "</strong>"
        );

      }

      else if(phase.part === 1){

        setHTML(
          guide,
          "1부 마지막 교실 놀이입니다 😊<br>" +
          "놀이가 끝나면 <strong>강당 이동 준비</strong>를 합니다."
        );

      }

      else{

        setHTML(
          guide,
          "2부 마지막 놀이입니다 😊<br>" +
          "놀이가 끝나면 모든 체험이 완료됩니다."
        );

      }

    }

  }


  /* -------------------
     이동
  ------------------- */

  else if(phase.type === "move"){

    const next = ROOMS[room.nextRoom];

    setText(partBadge,phase.part + "부");

    statusText =
      "🚶 " + phase.part + "부 · " +
      phase.round + "라운드 이동";

    setImage(next.img,next.name);
    setText(roomLabel,"다음 놀이마당 · " + next.classroom);
    setText(playName,next.name);

    setText(timerLabel,"이동 시간");
    setText(timerEl,formatTimer(remaining));

    if(remaining <= 15){
      statusClass = "warning";
      timerClass = "warning";
    }

    setHTML(
      guide,
      "현재 새로가족은 <strong>" +
      josaRo(next.classroom) +
      "</strong> 이동해주세요.<br>" +
      room.classroom +
      "에서는 다음 새로가족을 맞이할 준비를 해주세요."
    );

  }


  /* -------------------
     1부 정리
  ------------------- */

  else if(phase.type === "tidy"){

    setText(partBadge,"1부 마무리");

    statusText = "🧹 1부 교실 놀이 완료";

    setImage(room.img,room.name);
    setText(roomLabel,"1부 마무리");
    setText(playName,"놀이 정리");

    setText(timerLabel,"교대 이동까지");
    setText(timerEl,formatTimer(remaining));

    setHTML(
      guide,
      "놀잇감을 정리하고 <strong>강당으로 이동할 준비</strong>를 해주세요."
    );

  }


  /* -------------------
     교대
  ------------------- */

  else if(phase.type === "swap"){

    setText(partBadge,"1부 ↔ 2부");

    statusText = "🐦 새로가족 교대 이동";

    setImage(room.img,room.name);
    setText(roomLabel,"1부 ↔ 2부 교대");
    setText(playName,"이동 시간");

    setText(timerLabel,"2부 시작까지");
    setText(timerEl,formatTimer(remaining));

    setHTML(
      guide,
      "1부 교실 놀이팀은 <strong>강당으로 이동</strong>합니다.<br>" +
      "2부 교실 놀이팀은 <strong>" +
      josaRo(room.classroom + " " + room.name) +
      "</strong> 이동해주세요."
    );

  }


  /* -------------------
     완료
  ------------------- */

  else{

    setText(partBadge,"행사 완료");

    statusText = "🎉 전래 놀이 한마당 완료";

    showImage = false;

    setText(roomLabel,"수고하셨습니다!");
    setText(playName,"모든 체험 완료");

    setText(timerLabel,"");
    setText(timerEl,"✓");

    setHTML(
      guide,
      "새로가족 모두 수고했습니다 😊<br>" +
      "<strong>각자 교실로 이동해주세요.</strong>"
    );

  }


  /* 정지 중에는 경고 연출을 끈다 */

  if(paused){
    statusText = "⏸ 일시정지 중 — " + statusText;
    statusClass = "paused";
    timerClass = "paused";
  }

  setText(statusBar,statusText);

  setClass(
    statusBar,
    "status" + (statusClass ? " " + statusClass : "")
  );

  setClass(
    timerEl,
    "timer" + (timerClass ? " " + timerClass : "")
  );

  setClass(
    identity,
    "identity" + (showImage ? "" : " no-image")
  );

  renderSteps(phase);

  renderAdmin(now);

}


/* =====================================================
   20. 운영 패널 — 한 번 눌러 열기
===================================================== */

let panelTimer = null;


function touchPanel(){

  clearTimeout(panelTimer);

  panelTimer = setTimeout(closePanel,30000);

}


function openPanel(){

  adminPanel.classList.add("show");
  adminOpenBtn.classList.add("open");

  unlockAudio();

  touchPanel();
}


function closePanel(){

  clearTimeout(panelTimer);

  adminPanel.classList.remove("show");
  adminOpenBtn.classList.remove("open");

}


adminOpenBtn.addEventListener(
  "click",
  () => {

    if(adminPanel.classList.contains("show")){
      closePanel();
    }else{
      openPanel();
    }

  }
);


adminPanel.addEventListener("pointerdown",touchPanel);


/* 화면 아무 곳이나 누르면 패널이 닫힌다 */

document.addEventListener(
  "pointerdown",
  event => {

    if(!adminPanel.classList.contains("show")){
      return;
    }

    if(
      adminPanel.contains(event.target) ||
      adminOpenBtn.contains(event.target)
    ){
      return;
    }

    closePanel();

  }
);


/* =====================================================
   21. 운영 버튼
===================================================== */

$("panelCloseBtn").addEventListener("click",closePanel);

pauseBtn.addEventListener("click",togglePause);

$("prevBtn").addEventListener("click",previousStage);

$("nextBtn").addEventListener("click",nextStage);

$("plus30Btn").addEventListener(
  "click",
  () => extendTime(30 * 1000)
);

$("plus60Btn").addEventListener(
  "click",
  () => extendTime(60 * 1000)
);

$("autoBtn").addEventListener("click",returnToAuto);

soundBtn.addEventListener(
  "click",
  () => setSound(!soundOn)
);

$("changeRoomBtn").addEventListener(
  "click",
  () => {
    closePanel();
    setup.style.display = "flex";
  }
);


/* =====================================================
   22. 전체화면
===================================================== */

async function toggleFullscreen(){

  try{

    if(!document.fullscreenElement){
      await document.documentElement.requestFullscreen();
    }else{
      await document.exitFullscreen();
    }

  }catch{}

}


fullscreenBtn.addEventListener("click",toggleFullscreen);

$("setupFullscreenBtn").addEventListener("click",toggleFullscreen);


document.addEventListener(
  "fullscreenchange",
  () => {

    fullscreenBtn.textContent =
      document.fullscreenElement
        ? "⛶ 전체화면 해제"
        : "⛶ 전체화면";

  }
);


/* =====================================================
   23. 동기화
===================================================== */

/*
  숫자를 1초씩 빼지 않는다.
  항상 현재 시각과 종료 절대시각의 차이를
  새로 계산하므로 백그라운드에서도
  오차가 누적되지 않는다.
*/

setInterval(render,250);


document.addEventListener(
  "visibilitychange",
  () => {

    if(document.visibilityState === "visible"){
      requestWakeLock();
      render();
    }

  }
);


window.addEventListener(
  "focus",
  () => {
    requestWakeLock();
    render();
  }
);


/* =====================================================
   24. 초기화
===================================================== */

if(currentRoom){
  loadManualState();
}

requestWakeLock();

render();

})();
